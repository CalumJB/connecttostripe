spring.application.name=connect to stripe
environment=DEMO

# Stripe Configuration (secrets in application-local.properties)
stripe.signing.secret=${STRIPE_SIGNING_SECRET:}
stripe.endpoint.secret=${STRIPE_ENDPOINT_SECRET:}
stripe.billing.secret=${STRIPE_BILLING_SECRET:}
stripe.billing.endpoint.secret=${STRIPE_BILLING_ENDPOINT_SECRET:}

# Mailchimp Configuration (secrets in application-local.properties)
mailchimp.client-id=${MAILCHIMP_CLIENT_ID:}
mailchimp.client-secret=${MAILCHIMP_CLIENT_SECRET:}
mailchimp.redirect-uri=http://127.0.0.1:8080/api/oauth/mailchimp/callback
mailchimp.stripe.redirect-uri=https://dashboard.stripe.com/dashboard?apps[connecttomailchimp-demo][drawer]=

# Database Configuration  
spring.datasource.url=jdbc:postgresql://localhost:5432/connecttostripe
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true

# Active Profiles - uncomment for local development
# spring.profiles.active=local


